<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,fs,cw,ch,cols,rows,fsO=0,ema=17,fc=0;

fs=fsO||(W<600?7:10);ctx.font=fs+'px ui-monospace,Menlo,Consolas,monospace';cw=ctx.measureText('M').width;ch=fs*1.05;cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);}

let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const hash=(a,b,c)=>{const s=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return s-Math.floor(s)};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const norm=v=>{const m=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/m,v[1]/m,v[2]/m]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

const pts=[];
// generic curved petal/leaf surface
function surface(o){
  const {a,L,Wd,th0,th1,cup,col,nu=36,nv=20}=o;
  const P=(u,v)=>{
    let r=0,h=0;const n=12;
    for(let i=0;i<n;i++){const t=(i+.5)/n*u,th=th0+th1*t;r+=Math.sin(th)*u/n;h+=Math.cos(th)*u/n}
    r*=L;h*=L;
    const w=Wd*1.12*Math.pow(Math.sin(Math.PI*Math.pow(u,.65)),1.15)*(1+.06*Math.sin(u*22+a)),lat=v*w;
    const y=h+cup*lat*lat+.03*Math.sin(u*16+a*5)*v*v-.02*Math.exp(-v*v*40)*Math.sin(Math.PI*u)+.008*Math.sin(u*38+v*7)*Math.abs(v)+.09*u*u*u*v*Math.cos(a*2);
    return[r*Math.cos(a)-lat*Math.sin(a),y,r*Math.sin(a)+lat*Math.cos(a)];
  };
  for(let i=1;i<=nu;i++)for(let j=0;j<nv;j++){
    const u=i/nu,v=-1+2*j/(nv-1),p=P(u,v);
    const du=P(Math.min(1,u+.01),v),dv=P(u,Math.min(1,v+.02));
    const n=norm(cross([du[0]-p[0],du[1]-p[1],du[2]-p[2]],[dv[0]-p[0],dv[1]-p[1],dv[2]-p[2]]));
    const cc=col(u,v);pts.push({p,n,c:cc,ch:cc.e?'#':undefined});
  }
}
const PAL={
 star:{base:[255,85,160],edge:[255,236,246],spot:[170,20,80],throat:[200,235,120]},
 white:{base:[236,242,224],edge:[255,255,255],spot:null,throat:[205,235,130]},
 orange:{base:[255,115,20],edge:[255,195,100],spot:[110,35,10],throat:[255,225,90]},
 yellow:{base:[255,205,40],edge:[255,238,130],spot:null,throat:[210,230,90]},
 pink:{base:[248,125,180],edge:[255,220,235],spot:[200,60,120],throat:[225,240,150]}
};
function petalColor(pal,k){return(u,v)=>{
  const t=Math.abs(v);
  let c=mix(pal.base,pal.edge,sm(.3,1,t)*.85+Math.max(0,u-.8)*.6);
  if(u<.25)c=mix(pal.throat,c,u/.25);
  const vv=t*3,vf=Math.abs(vv-Math.round(vv));if(vf<.22&&u>.12&&u<.93)c=mix(c,pal.edge,.3);
  if(t<.07)c=mix(c,[255,255,255],.35);
  if(u<.5&&hash(Math.floor(u*60),Math.floor((v+1)*30),k)>.975)c=[235,130,30];
  if(pal.spot&&u>.12&&u<.65&&t<.85&&hash(Math.floor(u*10),Math.floor((v+1)*3),k)>.78)c=pal.spot;
  if(pal.spot&&c===pal.spot&&hash(Math.floor(u*40),Math.floor((v+1)*18),k+7)>.55)c=mix(pal.spot,[90,10,50],.5);
  const ao=.72+.28*sm(0,.35,u);c=[c[0]*ao,c[1]*ao,c[2]*ao];
  if(u<.38&&t<.09)c=mix(c,[205,235,110],.6*(1-u/.38));
  if(t>.8||u>.95){c=mix(c,[70,10,45],.5);c.e=1;}
  return c;}}

const bottom=[0,-1.8,0];
const PH=["I LOVE YOU ","TE AMO ","JE T’AIME ","ICH LIEBE DICH ","TI AMO ","EU TE AMO ","我爱你 ","愛してる ","Я ТЕБЯ ЛЮБЛЮ ","사랑해 ","SENI SEVIYORUM ","ΣΕ ΑΓΑΠΩ "];
PH.length=0;PH.push("I love you ");
let stemN=0;
const stemCh=(ph,y)=>ph[((Math.floor(-y/.125)%ph.length)+ph.length)%ph.length];
function lily(pos,pal,sc){
  const local=pts.length;const start=pts.length;
  const roll=rnd()*6.28;
  for(let k=0;k<6;k++){
    const inner=k%2===1;
    surface({a:roll+k*Math.PI/3,L:.92+rnd()*.16,Wd:inner?.40:.30,th0:(inner?.5:.75)+rnd()*.12,th1:inner?.95:1.4,cup:inner?.9:.7,col:petalColor(pal,k)});
  }
  // stamens + pistil (local coords)
  for(let k=0;k<6;k++){
    const a=k*Math.PI/3+.3;
    for(let i=0;i<=14;i++){const t=i/14,r=.42*Math.pow(t,1.3),y=.1+.6*t-.15*t*t;
      pts.push({p:[r*Math.cos(a),y,r*Math.sin(a)],n:[Math.cos(a),.3,Math.sin(a)],c:[235,240,205]});}
    const tr=.42,ty=.55,tx=tr*Math.cos(a),tz=tr*Math.sin(a);
    for(let q=0;q<18;q++)pts.push({p:[tx+(rnd()-.5)*.17,ty+(rnd()-.5)*.17,tz+(rnd()-.5)*.17],n:[Math.cos(a),.2,Math.sin(a)],c:[205,85,20],ch:'@'});
  }
  for(let i=0;i<=16;i++){const t=i/16;pts.push({p:[.12*t*t,.05+.85*t,0],n:[1,0,0],c:mix([215,235,150],[110,200,90],t*t)});}
  // transform to world
  const dir=norm([pos[0]-bottom[0],pos[1]-bottom[1]+.6,pos[2]-bottom[2]]);
  let e1=norm(cross(dir,Math.abs(dir[2])<.9?[0,0,1]:[1,0,0]));const e2=cross(dir,e1);
  for(let i=start;i<pts.length;i++){const q=pts[i];
    const f=v=>[e1[0]*v[0]+dir[0]*v[1]+e2[0]*v[2],e1[1]*v[0]+dir[1]*v[1]+e2[1]*v[2],e1[2]*v[0]+dir[2]*v[1]+e2[2]*v[2]];
    const w=f(q.p);q.p=[w[0]*sc+pos[0],w[1]*sc+pos[1],w[2]*sc+pos[2]];q.n=f(q.n);q.fl=1;q.h=start;q.hp=pos;}
  const ph=PH[stemN++%PH.length];
  // stem
  for(let i=0;i<=100;i++){const t=i/100,
    p=[pos[0]+(bottom[0]-pos[0])*t+Math.sin(t*3)*.08,pos[1]+(bottom[1]-pos[1])*t,pos[2]+(bottom[2]-pos[2])*t];
    for(let r=0;r<4;r++){const g=r*1.57;pts.push({p:[p[0]+Math.cos(g)*.045,p[1],p[2]+Math.sin(g)*.045],n:[Math.cos(g),0,Math.sin(g)],c:[110,225,125],lch:stemCh(ph,p[1])});}}
}

lily([.5,1.0,-1.4],PAL.star,.7);

lily([1.5,-.8,-.3],PAL.orange,.65);
lily([-1.0,1.3,-.9],PAL.pink,.7);
lily([1.0,1.3,-.9],PAL.star,.7);

lily([0,-.6,-1.5],PAL.white,.6);
lily([-1.2,1.6,.2],PAL.pink,.65);
function bud(pos,sc){
  const dir=norm([pos[0]-bottom[0],pos[1]-bottom[1]+.6,pos[2]-bottom[2]]),e1=norm(cross(dir,Math.abs(dir[2])<.9?[0,0,1]:[1,0,0])),e2=cross(dir,e1);
  const f=v=>[e1[0]*v[0]+dir[0]*v[1]+e2[0]*v[2],e1[1]*v[0]+dir[1]*v[1]+e2[1]*v[2],e1[2]*v[0]+dir[2]*v[1]+e2[2]*v[2]];
  for(let i=0;i<=28;i++){const u=i/28,r=.11*Math.sin(Math.PI*Math.pow(u,.8))+.01;
    for(let j=0;j<16;j++){const g=j/16*6.283,c0=mix([90,170,90],[255,150,190],sm(.35,.95,u)),c=Math.abs(Math.sin(g*3))<.12?mix(c0,[255,255,255],.3):c0;
      const w=f([Math.cos(g)*r,u*.55,Math.sin(g)*r]);pts.push({p:[w[0]*sc+pos[0],w[1]*sc+pos[1],w[2]*sc+pos[2]],n:f([Math.cos(g),.2,Math.sin(g)]),c});}}
  const ph=PH[stemN++%PH.length];
  for(let i=0;i<=100;i++){const t=i/100,p=[pos[0]+(bottom[0]-pos[0])*t+Math.sin(t*3)*.08,pos[1]+(bottom[1]-pos[1])*t,pos[2]+(bottom[2]-pos[2])*t];
    for(let r=0;r<4;r++){const g=r*1.57;pts.push({p:[p[0]+Math.cos(g)*.045,p[1],p[2]+Math.sin(g)*.045],n:[Math.cos(g),0,Math.sin(g)],c:[110,225,125],lch:stemCh(ph,p[1])});}}
}
[[-1.7,1.2,-.5],[1.7,1.3,-.4],[-.9,1.7,-.2],[.8,1.6,-.6],[-2.2,.5,.3],[2.3,.6,.4],[0,1.0,-1.6],[1.3,.9,1.3]].forEach(p=>bud(p,.8));

// cute original kitty face in the middle
function cat(cx0,cy0,cz0,R){
  const white=[255,250,250],ink=[120,90,160],pink=[255,150,190];
  const add=(p,n,c,ch)=>pts.push({p:[p[0]+cx0,p[1]+cy0,p[2]+cz0],n,c,ch});
  const ell=(ex,ey,ez,a,b,c,fc)=>{for(let i=0;i<30;i++){const th=Math.PI*i/29;for(let j=0;j<40;j++){const ph=2*Math.PI*j/40,x=Math.sin(th)*Math.cos(ph),y=Math.cos(th),z=Math.sin(th)*Math.sin(ph);add([ex+a*x,ey+b*y,ez+c*z],norm([x/a,y/b,z/c]),fc(z));}}};
  ell(-.42*R,.5*R,-.02*R,.2*R,.25*R,.12*R,z=>z>.3?pink:white);
  ell(.42*R,.5*R,-.02*R,.2*R,.25*R,.12*R,z=>z>.3?pink:white);
  const A=.62*R,B=.52*R,C=.28*R;
  for(let i=0;i<80;i++){const th=Math.PI*i/79;for(let j=0;j<140;j++){const ph=2*Math.PI*j/140,x=Math.sin(th)*Math.cos(ph),y=Math.cos(th),z=Math.sin(th)*Math.sin(ph);
    const fx=x*A,fy=y*B;let c=white,ch;
    if(z>.3){
      const e1=Math.pow((Math.abs(fx)-.22*R)/(.06*R),2)+Math.pow((fy-.06*R)/(.09*R),2);
      const bl=Math.pow((Math.abs(fx)-.38*R)/(.1*R),2)+Math.pow((fy+.1*R)/(.06*R),2);
      const ns=Math.pow(fx/(.05*R),2)+Math.pow((fy+.02*R)/(.035*R),2);
      const my=-.14*R+2*fx*fx/R;
      if(e1<1){c=ink;ch='@'}else if(ns<1)c=[255,170,60];else if(Math.abs(fx)<.14*R&&Math.abs(fy-my)<.014*R){c=ink;ch='@'}else if(bl<1)c=pink;
    }
    add([fx,fy,C*z],norm([x/A,y/B,z/C]),c,ch);}}
  for(let gx=-1.3;gx<=1.3;gx+=.05)for(let gy=-1.3;gy<=1.3;gy+=.05){const q=gx*gx+gy*gy-1;if(q*q*q-gx*gx*gy*gy*gy<0)add([.44*R+gx*.15*R,.55*R+gy*.15*R+.05*R,.3*R],[0,0,1],[255,60,110]);}
}


// 3D letters: AVA
(function(){
  const tc=document.createElement('canvas');tc.width=420;tc.height=150;const t=tc.getContext('2d');
  t.fillStyle='#000';t.font='900 80px Arial Black, Arial, sans-serif';t.textAlign='center';t.textBaseline='middle';/* big lettering off */
  const d=t.getImageData(0,0,420,150).data,S=.005;
  const on=(x,y)=>x>=0&&y>=0&&x<420&&y<150&&d[(y*420+x)*4+3]>=128;
  for(let py=0;py<150;py+=3)for(let px=0;px<420;px+=3){if(d[(py*420+px)*4+3]<128){if(on(px-6,py)||on(px+6,py)||on(px,py-6)||on(px,py+6)||on(px-5,py-5)||on(px+5,py+5)||on(px-5,py+5)||on(px+5,py-5))pts.push({p:[(px-210)*S,-2.2+(75-py)*S,.72],n:[0,0,1],c:[255,215,235],ch:'@'});continue;}
    for(const lz of[-.09,-.03,.03,.09])pts.push({p:[(px-210)*S,-2.2+(75-py)*S,.8+lz*.6],n:[0,0,lz>0?1:-1],c:[120,25,95],ch:'@'});}
})();

// baby’s-breath filler
for(let i=0;i<220;i++){const a=rnd()*6.283,b=Math.acos(rnd()*1.2-.2),R=2.3+rnd()*.7;
  pts.push({p:[R*Math.sin(b)*Math.cos(a),R*Math.cos(b)*.8-.2,R*Math.sin(b)*Math.sin(a)],n:[0,1,0],c:[255,250,255],ch:'o'});}

// leaves
for(let k=0;k<7;k++){
  const a=k*(Math.PI*2/7)+.2;const s=pts.length;
  surface({a,L:1.9,Wd:.2,th0:.3,th1:.55,cup:.5,nu:48,nv:14,col:(u,v)=>Math.abs(v)<.08?[130,205,120]:mix([30,110,55],[60,160,75],u)});
  for(let i=s;i<pts.length;i++){pts[i].p[1]+=bottom[1]+.1}
}
// stem bundle, ribbon band and bow
for(let s=0;s<9;s++){const a=s*.7,r0=.05+.05*(s%3),r1=.02+.1*(s%3);
  for(let i=0;i<=70;i++){const t=i/70,y=-1.8-t*2.5,rr=r0+(r1-r0)*t;
    for(let q=0;q<4;q++){const g=q*1.57;pts.push({p:[rr*Math.cos(a)+Math.cos(g)*.045,y,rr*Math.sin(a)+Math.sin(g)*.045],n:[Math.cos(g),0,Math.sin(g)],c:[110,225,125],lch:stemCh(PH[s%PH.length],y)});}}}
const bowI=pts.length;
for(let i=0;i<=12;i++){const y=-2.3+i/12*.3;for(let j=0;j<70;j++){const g=j/70*6.283;
  pts.push({p:[.27*Math.cos(g),y,.27*Math.sin(g)],n:[Math.cos(g),0,Math.sin(g)],c:[235,80,140]});}}
const bandEnd=pts.length;
const bc=[0,-2.15,.28];
for(const sg of[-1,1])for(let j=0;j<130;j++){const th=j/130*6.283;for(let m=0;m<9;m++){
  const rho=.62+m/8*.38,a=.5,b=.36,lx=sg*(a+rho*a*Math.cos(th)),ly=rho*b*Math.sin(th),lz=.1*Math.sin(Math.PI*m/8)+.05*Math.abs(lx);
  pts.push({p:[bc[0]+lx,bc[1]+ly,bc[2]+lz],n:norm([lx*.3,ly*.3,1]),c:mix([255,95,155],[255,185,215],m/8)});}}
const loopEnd=pts.length;
for(const sg of[-1,1])for(let i=0;i<=44;i++){const s=i/44;for(let q=-3;q<=3;q++){
  const x=sg*(.12+.5*s)+q*.025*(1+s*.5)+.05*Math.sin(s*7),y=-.08-1.0*s;
  pts.push({p:[bc[0]+x,bc[1]+y,bc[2]+.04+.05*Math.sin(s*5)],n:[0,0,1],c:mix([255,95,155],[255,150,195],s)});}}
const tailEnd=pts.length;
for(let i=0;i<20;i++){const th=Math.PI*i/19;for(let j=0;j<30;j++){const ph=6.283*j/30,x=Math.sin(th)*Math.cos(ph),y=Math.cos(th),z=Math.sin(th)*Math.sin(ph);
  pts.push({p:[bc[0]+.15*x,bc[1]+.15*y,bc[2]+.05+.15*z],n:[x,y,z],c:[235,70,130]});}}
for(let i=bowI;i<pts.length;i++){const q=pts[i];q.bw=i<bandEnd?1:i<loopEnd?2:i<tailEnd?3:4;
  if(q.bw===1)q.a=Math.atan2(q.p[2],q.p[0])/6.2832+.5;
  if(q.bw===3)q.s=Math.max(0,Math.min(1,-(q.p[1]+2.15)-.08));}
// sparkles
const sparks=[];
for(let i=0;i<110;i++){const a=rnd()*6.28,b=Math.acos(2*rnd()-1),R=3.2+rnd()*1.6;
  sparks.push({p:[R*Math.sin(b)*Math.cos(a),R*Math.cos(b)*.9-.5,R*Math.sin(b)*Math.sin(a)],ch:rnd()<.5?'.':'+',ph:rnd()*6.28});}

const hsl=(h,s,l)=>{const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0)*255,f(8)*255,f(4)*255]};
const recolor=(c,m,h)=>{const L=(c[0]+c[1]+c[2])/765;return m===1?mix([255,80,150],[255,235,245],L*L):m===2?mix([190,200,225],[255,255,255],L):hsl((h*47)%360,.9,.45+.3*L)};
const petals=Array.from({length:30},()=>({x:(rnd()-.5)*4,y:rnd()*7-3.5,z:(rnd()-.5)*4,v:.006+rnd()*.008,ph:rnd()*6.28,ch:['(',')','~','`'][(rnd()*4)|0],col:rnd()<.5?'rgb(255,170,205)':'rgb(255,235,245)'}));
const hearts=Array.from({length:10},(_,i)=>({x:(rnd()-.5)*3,y:-1+rnd()*4,z:(rnd()-.5)*3,v:.012,life:i/10,ph:rnd()*6.28}));
